<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KB-Sync · Pack-Based Knowledge Management</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Barlow+Condensed:wght@300;400;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f2ece2;
      --color-ink:     #2c2420;
      --color-muted:   #5c5349;
      --color-accent:  #c4501a;
      --font-sans:     'Barlow Condensed', system-ui, sans-serif;
      --font-serif:    'Playfair Display', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 2rem;
    }

    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">KB-Sync Architecture · Knowledge Packaging</p>
    <h1>Pack-Based Knowledge Management Architecture</h1>

    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="100%">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#c4501a"/>
        </marker>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
          <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2c2420" flood-opacity="0.08"/>
        </filter>
      </defs>

      <!-- Stage 1: Ingestion -->
      <g filter="url(#shadow)">
        <rect x="30" y="40" width="300" height="380" rx="12" fill="#fff" stroke="#e3d8cc" stroke-width="1.5"/>
        <rect x="30" y="40" width="300" height="42" rx="12" fill="#2c2420"/>
        <rect x="30" y="70" width="300" height="12" fill="#2c2420"/>
        <text x="50" y="67" font-family="'Barlow Condensed', sans-serif" font-size="16" font-weight="700" fill="#f2ece2" letter-spacing="1">1. MULTI-SOURCE INGESTION</text>
        
        <rect x="50" y="105" width="260" height="70" rx="8" fill="#f8f5f0" stroke="#e3d8cc"/>
        <text x="65" y="130" font-family="'Barlow Condensed', sans-serif" font-size="15" font-weight="600" fill="#2c2420">Raw Corpora & Transcripts</text>
        <text x="65" y="152" font-family="'Geist Mono', monospace" font-size="12" fill="#5c5349">PDF, Audio, Media, HTML</text>

        <rect x="50" y="195" width="260" height="70" rx="8" fill="#f8f5f0" stroke="#e3d8cc"/>
        <text x="65" y="220" font-family="'Barlow Condensed', sans-serif" font-size="15" font-weight="600" fill="#2c2420">Immutable Digest Pinning</text>
        <text x="65" y="242" font-family="'Geist Mono', monospace" font-size="12" fill="#c4501a">SHA-256 Content Hashing</text>

        <rect x="50" y="285" width="260" height="105" rx="8" fill="#f8f5f0" stroke="#e3d8cc"/>
        <text x="65" y="310" font-family="'Barlow Condensed', sans-serif" font-size="15" font-weight="600" fill="#2c2420">Staging Partitioning</text>
        <text x="65" y="332" font-family="'Geist Mono', monospace" font-size="12" fill="#5c5349">_kb-sync-staging/ directory</text>
        <text x="65" y="352" font-family="'Geist Mono', monospace" font-size="12" fill="#5c5349">Write-once immutable state</text>
        <text x="65" y="372" font-family="'Geist Mono', monospace" font-size="12" fill="#5c5349">FILES.manifest.txt</text>
      </g>

      <!-- Arrow 1 to 2 -->
      <path d="M 330 230 L 395 230" fill="none" stroke="#c4501a" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Stage 2: Packaging -->
      <g filter="url(#shadow)">
        <rect x="400" y="40" width="300" height="380" rx="12" fill="#fff" stroke="#e3d8cc" stroke-width="1.5"/>
        <rect x="400" y="40" width="300" height="42" rx="12" fill="#c4501a"/>
        <rect x="400" y="70" width="300" height="12" fill="#c4501a"/>
        <text x="420" y="67" font-family="'Barlow Condensed', sans-serif" font-size="16" font-weight="700" fill="#f2ece2" letter-spacing="1">2. KNOWLEDGE PACK (topic.pack.v1)</text>

        <rect x="420" y="105" width="260" height="70" rx="8" fill="#f8f5f0" stroke="#e3d8cc"/>
        <text x="435" y="130" font-family="'Barlow Condensed', sans-serif" font-size="15" font-weight="600" fill="#2c2420">topic.manifest.json</text>
        <text x="435" y="152" font-family="'Geist Mono', monospace" font-size="12" fill="#5c5349">Domain, Hierarchy & Version</text>

        <rect x="420" y="195" width="260" height="70" rx="8" fill="#f8f5f0" stroke="#e3d8cc"/>
        <text x="435" y="220" font-family="'Barlow Condensed', sans-serif" font-size="15" font-weight="600" fill="#2c2420">specs/task-*.json</text>
        <text x="435" y="242" font-family="'Geist Mono', monospace" font-size="12" fill="#5c5349">research.task.v1 work items</text>

        <rect x="420" y="285" width="260" height="105" rx="8" fill="#f8f5f0" stroke="#e3d8cc"/>
        <text x="435" y="310" font-family="'Barlow Condensed', sans-serif" font-size="15" font-weight="600" fill="#2c2420">corpus/source_catalog.json</text>
        <text x="435" y="332" font-family="'Geist Mono', monospace" font-size="12" fill="#5c5349">Cryptographic source registry</text>
        <text x="435" y="352" font-family="'Geist Mono', monospace" font-size="12" fill="#5c5349">config/audit_rules.json</text>
        <text x="435" y="372" font-family="'Geist Mono', monospace" font-size="12" fill="#5c5349">Adversarial verification rules</text>
      </g>

      <!-- Arrow 2 to 3 -->
      <path d="M 700 230 L 765 230" fill="none" stroke="#c4501a" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Stage 3: Distribution Targets -->
      <g filter="url(#shadow)">
        <rect x="770" y="40" width="300" height="380" rx="12" fill="#fff" stroke="#e3d8cc" stroke-width="1.5"/>
        <rect x="770" y="40" width="300" height="42" rx="12" fill="#2c2420"/>
        <rect x="770" y="70" width="300" height="12" fill="#2c2420"/>
        <text x="790" y="67" font-family="'Barlow Condensed', sans-serif" font-size="16" font-weight="700" fill="#f2ece2" letter-spacing="1">3. DISTRIBUTION TARGETS</text>

        <rect x="790" y="105" width="260" height="60" rx="8" fill="#f8f5f0" stroke="#e3d8cc"/>
        <text x="805" y="130" font-family="'Barlow Condensed', sans-serif" font-size="15" font-weight="600" fill="#2c2420">Google NotebookLM</text>
        <text x="805" y="148" font-family="'Geist Mono', monospace" font-size="12" fill="#5c5349">Grounded research notebooks</text>

        <rect x="790" y="175" width="260" height="60" rx="8" fill="#f8f5f0" stroke="#e3d8cc"/>
        <text x="805" y="200" font-family="'Barlow Condensed', sans-serif" font-size="15" font-weight="600" fill="#2c2420">Obsidian Vault</text>
        <text x="805" y="218" font-family="'Geist Mono', monospace" font-size="12" fill="#5c5349">Interlinked semantic notes</text>

        <rect x="790" y="245" width="260" height="60" rx="8" fill="#f8f5f0" stroke="#e3d8cc"/>
        <text x="805" y="270" font-family="'Barlow Condensed', sans-serif" font-size="15" font-weight="600" fill="#2c2420">Local SQLite Context Cache</text>
        <text x="805" y="288" font-family="'Geist Mono', monospace" font-size="12" fill="#5c5349">fts5 BM25 + Vector embeddings</text>

        <rect x="790" y="315" width="260" height="60" rx="8" fill="#f8f5f0" stroke="#e3d8cc"/>
        <text x="805" y="340" font-family="'Barlow Condensed', sans-serif" font-size="15" font-weight="600" fill="#2c2420">Remote GitHub Wiki</text>
        <text x="805" y="358" font-family="'Geist Mono', monospace" font-size="12" fill="#5c5349">Flat HTML/PNG wiki distribution</text>
      </g>
    </svg>
  </div>
</body>
</html>
