# ==============================================================================
# Global Configuration for kb-sync Core Scripts
# Shared by all sync targets (NotebookLM, Obsidian, etc.)
# ==============================================================================

# Size thresholds (in bytes)
warning_bytes: 5000000  # 5MB — warn if pack approaches this
hard_bytes: 8000000     # 8MB — require chunking if exceeded

# Chunk size for line-safe splitting (split -C format: e.g., 4M, 100K)
chunk_size: 4M

# File exclusion patterns (glob format, matched against repo-relative paths)
skip_patterns:
  - package-lock.json
  - yarn.lock
  - pnpm-lock.yaml
  - "*node_modules/*"
  - "*dist/*"
  - "*build/*"
  - "*.png"
  - "*.jpg"
  - "*.jpeg"
  - "*.gif"
  - "*.svg"
  - "*.webp"
  - "*.ico"
  - "*.woff"
  - "*.woff2"
  - "*.ttf"
  - "*.eot"
  - "*.pdf"
  - "*.bin"
  - "*.zip"
  - "*.tar.gz"
  - "*.tgz"
  - "*playwright-report/*"
  - "*coverage/*"
  - "*_kb-sync-staging/*"
  - "*.nlm_pack*"
  - "*.test_*"

# Timeout and Retry Policy
automation:
  bash_workspace:
    timeout_ms: 90000              # Increase from default 30-45s
    retry_attempts: 3
    retry_backoff_ms: [5000, 15000, 30000]
    skip_on_failure: false          # Don't skip to next stage if timeout
    alert_on_failure: true
    alert_recipients:
      - "sorensencc@gmail.com"

trm:
  drive_buffer_root: "G:/My Drive/TRM-Research"
  cowork_inbox_root: "C:/Users/soren/OneDrive/Documents/Cowork/inbox"
  cowork_archive_root: "C:/Users/soren/OneDrive/Documents/Cowork/archive"
  onedrive_inbox_root: "C:/Users/soren/OneDrive/Copilot/inbox"
  onedrive_archive_root: "C:/Users/soren/OneDrive/Copilot/archive"
  ingest_debounce_seconds: 15
  lease_seconds: 14400
  ready_equivalents:
    precedence: ["sidecar", "frontmatter", "filename", "gdoc_title"]
    marker_tokens: ["ready", "completed", "done"]
  drive_export:
    mode: "local_first"
    oauth_client_json: ""
    on_missing_auth: "quarantine_gdoc_auth_expired"
  taxonomy:
    agent_origin: ["copilot", "grok", "human"]
    agent_version: ["m365-copilot", "copilot-web", "copilot-mobile", "grok-mobile", "grok-web", "grok-deepsearch", "manual-paste", "field-notes"]
    source_type: ["web", "m365", "mixed", "manual"]
    topics: ["cic", "spec", "rewrite", "trm", "kb", "default"]

