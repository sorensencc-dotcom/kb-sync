name: Full Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test:all (ubuntu-latest + Bash coverage required)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify Bash is available
        run: |
          if ! command -v bash &> /dev/null; then
            echo "ERROR: Bash not found on runner. This workflow requires ubuntu-latest."
            exit 1
          fi
          echo "Bash: $(bash --version | head -1)"

      - name: Run full test suite (Bash coverage required)
        env:
          REQUIRE_BASH_COVERAGE: "true"
        run: npm run test:all

      - name: Run wiki contract validation
        run: npm run wiki:validate-contract
